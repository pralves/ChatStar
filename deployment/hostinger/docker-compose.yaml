x-app-env: &app_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE must be set}
  FRONTEND_URL: ${FRONTEND_URL:-https://chat.eletrostarsoft.com.br}
  FORCE_SSL: ${FORCE_SSL:-true}
  ENABLE_ACCOUNT_SIGNUP: ${ENABLE_ACCOUNT_SIGNUP:-false}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DATABASE: ${POSTGRES_DATABASE:-chatwoot}
  POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
  REDIS_URL: redis://redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
  RAILS_ENV: production
  NODE_ENV: production
  RAILS_LOG_TO_STDOUT: 'true'
  RAILS_SERVE_STATIC_FILES: 'true'
  INSTALLATION_ENV: docker

services:
  rails:
    image: chatwoot/chatwoot:latest
    environment:
      <<: *app_env
    depends_on:
      - postgres
      - redis
    volumes:
      - storage_data:/app/storage
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    expose:
      - '3000'
    restart: unless-stopped

  sidekiq:
    image: chatwoot/chatwoot:latest
    environment:
      <<: *app_env
    depends_on:
      - postgres
      - redis
    volumes:
      - storage_data:/app/storage
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: unless-stopped

  prepare:
    image: chatwoot/chatwoot:latest
    profiles:
      - setup
    environment:
      <<: *app_env
    depends_on:
      - postgres
      - redis
    volumes:
      - storage_data:/app/storage
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 'db:chatwoot_prepare']
    restart: 'no'

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatwoot}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    restart: unless-stopped

  redis:
    image: redis:alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-https://chat.eletrostarsoft.com.br}
    depends_on:
      - rails
    command: ["sh", "-c", "caddy reverse-proxy --from \"$FRONTEND_URL\" --to rails:3000"]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  storage_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
